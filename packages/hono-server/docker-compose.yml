services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: rssfed
      POSTGRES_PASSWORD: rssfed
      POSTGRES_DB: rssfed
    volumes:
      - rssfed-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rssfed"]
      interval: 10s
      start_period: 30s
    restart: always

  couchdb:
    image: couchdb:3
    ports:
      - "127.0.0.1:5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    volumes:
      - rssfed-couchdb:/opt/couchdb/data
      # Proxy Auth 的认证 handler 只在 CouchDB 启动时加载（config API 改它无效，
      # CouchDB 3.5 也没有 POST /_restart），所以必须随容器启动注入，
      # 否则 /api/couchdb/proxy/* 全部 401、前端看不到订阅内容。
      # 不能加 `:ro`：entrypoint 会 chown 该文件，只读挂载会让它 set -e 退出；
      # 用 00- 前缀是为了让 docker.ini 继续当 config API 的写入目标。
      # 副作用：跑过 compose 之后，仓库里这个文件的属主会变成 couchdb(5984)，
      # 要编辑它得用 sudo（内容不会变，git status 仍然干净）。
      - ../../deploy/couchdb-proxy-auth.ini:/opt/couchdb/etc/local.d/00-proxy-auth.ini
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 10s
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - rssfed-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      start_period: 30s
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rssfed.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - rssfed-pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: always

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    profiles: ["dev"]
    ports:
      # 只绑宿主回环：dev 存储不需要对局域网开放，避免同网段设备拿仓库里的
      # dev 凭据直接读写开发数据（手机调试只用到 Nuxt 的 3000 与后端 3001）
      - "127.0.0.1:8333:8333"   # S3 API
      - "127.0.0.1:9333:9333"   # Master 通信端口
      - "127.0.0.1:8081:8081"   # Web UI
    command: "server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    restart: always

  rsshub:
    # 使用本地源码构建的镜像（源码目录执行：docker build -t rsshub:local .）
    # 注意：rsshub:local 默认按 Dockerfile 的默认参数构建，
    #   PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 —— 不内置 Chromium，也未装 ca-certificates。
    #   因此需要浏览器渲染的路由（如 bilibili 的浏览器兜底、twitter 等）会 503。
    #   若需要这些路由，改用带浏览器的构建：
    #     docker build --build-arg PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 -t rsshub:local .
    #   （仅 linux/amd64 会下载 Chromium；该参数同时会安装 ca-certificates）
    image: rsshub:local
    # 本地专属 tag 不存在于任何 registry，禁止 compose 尝试拉取（缺失时直接报错而非静默 pull）
    pull_policy: never
    # 使用 host 网络，让容器直接共享 WSL 的网络栈。
    # 这样容器就能通过 WSL 默认网关访问 Windows 宿主机上的代理。
    network_mode: host
    volumes:
      - ./rsshub-config.yml:/app/rsshub-config.yml:ro
    environment:
      # 环境变量可覆盖 config 文件中的部分配置
      NODE_ENV: production
      # 代理：RSSHub 通过 PROXY_URI 环境变量配置代理（不是 config 文件的 proxy 字段）。
      # 代理运行在 Windows 宿主机上，WSL 需要走默认网关 172.29.96.1 访问。
      # 注意：不能用 127.0.0.1，因为那指向 WSL 自身，而代理不在 WSL 的 localhost 上监听。
      PROXY_URI: http://172.29.96.1:7897
    restart: always

volumes:
  rssfed-db:
  rssfed-couchdb:
  rssfed-redis:
  rssfed-pgadmin:
  seaweedfs-data:
