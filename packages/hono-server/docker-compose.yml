services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rssfed
      POSTGRES_PASSWORD: rssfed
      POSTGRES_DB: rssfed
    volumes:
      - rssfed-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rssfed"]
      interval: 10s
      start_period: 30s
    restart: always

  couchdb:
    image: couchdb:3
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    volumes:
      - rssfed-couchdb:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 10s
      start_period: 30s
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - rssfed-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      start_period: 30s
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rssfed.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - rssfed-pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: always

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    profiles: ["dev"]
    ports:
      - "8333:8333"       # S3 API
      - "9333:9333"       # Master 通信端口
      - "8081:8081"       # Web UI
    command: "server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json"
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data
    restart: always

  rsshub:
    # chromium-bundled 镜像内置了 CA 证书和 Chromium。
    # 相比默认镜像，它自带 /etc/ssl/certs/ca-certificates.crt，
    # 所以不需要再手动挂载证书或设置 NODE_EXTRA_CA_CERTS。
    # 同时也具备 puppeteer 能力，可抓取需要浏览器渲染的反爬路由。
    image: diygod/rsshub:chromium-bundled
    # 使用 host 网络，让容器直接共享 WSL 的网络栈。
    # 这样容器就能通过 WSL 默认网关访问 Windows 宿主机上的代理。
    network_mode: host
    volumes:
      - ./rsshub-config.yml:/app/rsshub-config.yml:ro
    environment:
      # 环境变量可覆盖 config 文件中的部分配置
      NODE_ENV: production
      # 代理：RSSHub 通过 PROXY_URI 环境变量配置代理（不是 config 文件的 proxy 字段）。
      # 代理运行在 Windows 宿主机上，WSL 需要走默认网关 172.29.96.1 访问。
      # 注意：不能用 127.0.0.1，因为那指向 WSL 自身，而代理不在 WSL 的 localhost 上监听。
      PROXY_URI: http://172.29.96.1:7897
    restart: always

volumes:
  rssfed-db:
  rssfed-couchdb:
  rssfed-redis:
  rssfed-pgadmin:
  seaweedfs-data:
