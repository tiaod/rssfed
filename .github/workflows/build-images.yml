# 构建镜像并推送到 GitHub Container Registry。
#
# 为什么在 CI 构建：生产服务器内存只有 ~2G，容器内构建 Nuxt 会 OOM，
# 所以镜像一律在这里构建，服务器只负责拉起运行。
#
# 镜像名：ghcr.io/<owner>/<repo>/<target>，带两个 tag：
#   latest       —— 常规发布用
#   sha-<短hash> —— 便于回滚到任意一次提交（改 compose 里的 tag 即可）
name: build-images

# 只做「构建 + 推送镜像」，部署是手工的：
#   docker compose --env-file .env.production -f docker-compose.prod.yml pull
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --no-build
# 不让 CI 直接 SSH 部署的原因：那要求把生产私钥交给云端 Runner，而构建阶段会执行
# 第三方依赖的代码，供应链一旦出问题，等于把服务器钥匙一并交出去。

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送 ghcr 需要
    strategy:
      fail-fast: false
      matrix:
        # migrate 也一并构建：它基于 builder 阶段，包含 drizzle-kit 与 schema 源码
        target: [server, web, migrate]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.target }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
