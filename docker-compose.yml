services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=rssfed
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=rssfed
    volumes:
      - rssfed-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rssfed"] 
      interval: 10s
      start_period: 30s
    restart: always

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - rssfed-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      start_period: 30s
    restart: always

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@rssfed.dev
      - PGADMIN_DEFAULT_PASSWORD=secret
    volumes:
      - rssfed-pgadmin:/var/lib/pgadmin
    depends_on:
      - db
    restart: always

  garage:
    image: dxflrs/garage:v2.3.0
    command: /garage server --single-node --default-bucket
    ports:
      - "3900:3900"
    environment:
      - GARAGE__RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE__ADMIN__ADMIN_TOKEN=${GARAGE_ADMIN_TOKEN}
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_DEFAULT_BUCKET:-rssfed}
    volumes:
      - garage-data:/var/lib/garage
    restart: always

volumes:
  rssfed-db:
  rssfed-redis:
  rssfed-pgadmin:
  garage-data: