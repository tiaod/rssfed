; =============================================================================
; CouchDB Proxy Authentication 启动配置（RSSFed）
;
; 为什么需要这个文件：
;   CouchDB 只在**进程启动时**读取 chttpd/authentication_handlers
;   （chttpd:set_auth_handlers/0 把解析结果固化进 application env），
;   启动之后再通过 config API 写这项配置对运行中的进程无效。
;   而 server 是「先连上 CouchDB、再写配置」，于是 proxy handler 从未挂载，
;   所有带 X-Auth-CouchDB-* 的转发请求都退化成匿名用户并被库级 _security 拒绝，
;   现象是整个 /api/couchdb/proxy/* 返回 401，前端看不到任何订阅内容。
;
;   CouchDB 3.5 已移除 POST /_restart（实测 404），应用侧无法自行触发重载，
;   所以把这项配置固化在 local.d 里，随容器启动一起加载。
;
; 挂载位置：/opt/couchdb/etc/local.d/00-proxy-auth.ini
;   两个必须遵守的约束：
;   1. 挂载时**不能加 `:ro`**。官方 entrypoint 会对 /opt/couchdb 下的文件执行
;      chown，只读挂载让 chown 返回非零，配合脚本里的 `set -e` 会让容器连日志
;      都没有就 exit 1（2026-09-22 首次部署时踩过）。
;   2. 文件名用 `00-` 前缀排在最前。CouchDB 通过 config API 写配置时会落到
;      local.d 里**最后加载**的文件（镜像自己生成的 docker.ini）；若把这个文件
;      排在它之后，COUCHDB_PROXY_SECRET 就会被写进这个受版本控制的文件。
;
; 注意：这里只放 authentication_handlers。
;   chttpd_auth/secret 与 proxy_use_secret 由 server 启动时通过 config API 写入
;   （每次请求都会重新读取，属于动态生效项），secret 不入库、不进版本控制。
; =============================================================================

[chttpd]
authentication_handlers = {chttpd_auth, cookie_authentication_handler}, {chttpd_auth, proxy_authentication_handler}, {chttpd_auth, default_authentication_handler}
