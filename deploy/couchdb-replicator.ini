; CouchDB 的复制器调参。
;
; ── 现在的拓扑：按需一次性复制，**没有常驻任务** ──────────────────────────────
; 聚合搬运不再往 `_replicator` 库里写文档，而是由服务端对"有新内容"的源调用一次
; `POST /_replicate`（同步调用、跑完即止），并发由我们的 BullMQ 队列
; （`rss-timeline-sync`，`TIMELINE_SYNC_CONCURRENCY`，默认 4）控制 —— 见
; ARCHITECTURE.md 的「搬运是按需的一次性复制」与 couchdb/replicator.ts。
;
; 于是本文件里的 `[replicator]` 各项**不再决定聚合的并发**（`_replicate` 不经过复制器
; 调度器），它们只剩两个作用：
;   1. 兜住升级/回滚后残留的常驻任务。老版本给每个 (用户 × 源) 建了一条 `continuous` 复制，
;      625 条一起追赶会把 2 核机打垮（生产实测 load 20.8、swap 1.6G/2G、源库都打不开）；
;      新代码第一轮聚合会把它们删干净（`_local/state.replicatorsPurged`），删之前这里限一下
;      同时开跑的数量，别让过渡期再把机器炸一遍。
;   2. 限住手工/其它途径塞进来的 `_replicator` 文档。
;
; ⚠️ 用 `max_jobs` 压**常驻**复制的并发是行不通的：常驻任务跑到 running 就永不结束、
; 不释放槽位，实测 max_jobs=50 时 running=50 / pending=573 一直不动（573 个源永久饿死）。
; 真正解决它的是"不再常驻"，不是调这个数。
;
; 这份文件是挂载进容器的（见 docker-compose*.yml 的 local.d 挂载），**容器重建才生效**。
; 部署后确认一次：
;   docker exec <couchdb 容器> cat /opt/couchdb/etc/local.d/01-replicator.ini
; （dev 上曾经没挂进去，一直在跑默认值。）
[replicator]
; 默认 500。现在只作为"残留常驻任务"的熔断：过渡期最多同时跑 50 条，
; 并且它们很快会被服务端删掉（不需要 ≥ 订阅源数 —— 按需复制不看这个值）。
max_jobs = 50
; 默认 20/每条复制；小复制不需要那么多连接
http_connections = 2
; 默认 100/分钟。残留任务的重启风暴也一并被限流（每个 reschedule 周期最多启停 20 条）。
max_churn = 20

; 库句柄上限。CouchDB 里有「几百个 feed 库 + 每用户一个库 + bot 库」，
; 而 default.ini 的 max_dbs_open = 500：一次性补装设计文档/过滤器（或一轮 reconcile
; 碰到几百个源）会**同时**打开几百个库，顶住之后报
;   `No DB shards could be opened.`
; （dev 实测：713 个 feed 库补装过滤器时 16 个失败，第二次重试才全部装上）。
; 它买的是文件描述符，必须和 compose 的 `ulimits.nofile` 一起放大 ——
; 只放大这个会先撞 fd 天花板：fd 不够时 CouchDB 连 JS 查询服务都起不来
; （`couch_proc_manager` get_proc 超时卡死），之后所有设计文档写不进、视图查不了，
; 表现为「聚合搬不动、客户端一条内容都同步不到」（见 docs/troubleshooting.md）。
[couchdb]
max_dbs_open = 2048
