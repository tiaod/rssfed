; CouchDB 复制器调参：聚合搬运的拓扑是「每个 (用户 × 订阅源) 一条常驻复制」
; （见 ARCHITECTURE.md 的「一个用户一个库、聚合在服务端完成」与 couchdb/replicator.ts）。
;
; 默认值（default.ini）是 max_jobs = 500、max_churn = 20：
;   - max_jobs 顶住之后，超出的任务进 pending 队列，新订阅不会立刻开始搬；
;   - max_churn 是「每次 reschedule（interval，默认 60s）最多启动/停止多少条」，
;     默认 20 会让「一次订阅了上百个源」的账号慢慢排队。
; 所以这里按「账号数 × 每账号几百个源」的量级放大一档；用户量真的涨上来之后，
; 应当改为按内存预算调小（每条复制都有常驻开销），而不是继续加。
;
; 排障（dev 实测，一个账号 627 个源）：一次性建出几百条任务时，_scheduler 里会出现成片的
; error/crashing，报 `replication_auth_error ... _session ... sel_conn_closed / req_timedout`，
; 目标库长时间不增长（任务会重试，但进展很慢）。default.ini 的 http_connections = 20 是
; **每条复制**的连接上限，几百条任务叠在一起会把 CouchDB 的 HTTP 层压满。真遇到这种情况，
; 按 CouchDB 对「大量小复制」的建议改这两个值再重启 couchdb（它们没写进本文件，因为还没实测过）：
;   [replicator] http_connections = 2   ; 默认 20，每条小复制不需要那么多连接
;   [replicator] worker_processes = 8   ; 默认 4，按核数给，别超过机器能扛的量
;
; 另一个坑：这份文件是挂载进去的（见 docker-compose*.yml 的 local.d 挂载），
; **容器重建才会生效**。部署后确认一次：
;   docker exec <couchdb 容器> cat /opt/couchdb/etc/local.d/01-replicator.ini
; （dev 上曾经没挂进去，一直在跑默认值。）
[replicator]
max_jobs = 1000
max_churn = 100

; 库句柄上限。聚合拓扑下 CouchDB 里有「几百个 feed 库 + 每用户一个库」，
; 而 default.ini 的 max_dbs_open = 500：一次性补装设计文档/过滤器（或一轮 reconcile
; 碰到几百个源）会**同时**打开几百个库，顶住之后报
;   `No DB shards could be opened.`
; （dev 实测：713 个 feed 库补装过滤器时 16 个失败，第二次重试才全部装上）。
; 它买的是文件描述符，必须和 compose 的 `ulimits.nofile` 一起放大 ——
; 只放大这个会先撞 fd 天花板：fd 不够时 CouchDB 连 JS 查询服务都起不来
; （`couch_proc_manager` get_proc 超时卡死），之后所有设计文档写不进、视图查不了，
; 表现为「聚合搬不动、客户端一条内容都同步不到」（见 docs/troubleshooting.md）。
[couchdb]
max_dbs_open = 2048
